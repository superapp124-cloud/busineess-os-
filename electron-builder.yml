appId: chat.chatr.desktop
productName: CHATR Desktop
npmRebuild: false
directories:
  output: dist-release
  buildResources: build
publish:
  provider: github
  owner: chatr-workspace
  repo: chatr-desktop

files:
  - dist-desktop/**/*
  - electron/**/*
  - node_modules/**/*
  - "!node_modules/@vercel/**"
  - "!node_modules/@capacitor/**"
  - "!node_modules/@capacitor-community/**"
  - "!node_modules/@capacitor-firebase/**"
  - "!node_modules/@ionic/**"
  - "!node_modules/@testing-library/**"
  - "!node_modules/@types/**"
  - "!node_modules/playwright/**"
  - "!node_modules/puppeteer/**"
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/favicon.ico
  artifactName: chatr-desktop-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  include: electron/installer.nsh

protocols:
  name: chatr-deep-link
  schemes:
    - chatr

fileAssociations:
  - ext: chatr
    name: CHATR OS Workspace
    role: Editor
  - ext: workflow
    name: CHATR Automation Workflow
    role: Editor
  - ext: memory
    name: CHATR AI Memory Pack
    role: Viewer

mac:
  target:
    - dmg
    - zip
