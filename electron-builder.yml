appId: chat.chatr.desktop
productName: CHATR Desktop
directories:
  output: dist-electron
  buildResources: build
publish:
  provider: github
  owner: chatr-workspace
  repo: chatr-desktop

files:
  - dist-desktop/**/*
  - electron/**/*
  - node_modules/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/favicon.ico
  artifactName: chatr-desktop-setup.${ext}
  certificateSubjectName: ${env.WIN_CSC_SUBJECT_NAME}
  certificateSha1: ${env.WIN_CSC_SHA1}
  signingHashAlgorithms:
    - sha256
  timeStampServer: http://timestamp.digicert.com
  signtoolOptions:
    certificateFile: ${env.WIN_CSC_LINK}
    certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  include: electron/installer.nsh

protocols:
  name: chatr-deep-link
  schemes:
    - chatr

fileAssociations:
  - ext: chatr
    name: CHATR OS Workspace
    role: Editor
  - ext: workflow
    name: CHATR Automation Workflow
    role: Editor
  - ext: memory
    name: CHATR AI Memory Pack
    role: Viewer

mac:
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
