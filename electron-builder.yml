appId: chat.chatr.desktop
productName: CHATR Desktop
copyright: "Copyright © 2026 TalentXcel Services Pvt Ltd. All rights reserved."
npmRebuild: false
asar: true
directories:
  output: dist-release
  buildResources: build
publish:
  provider: github
  owner: superapp124-cloud
  repo: busineess-os-

files:
  - dist-desktop/**/*
  - electron/**/*
  - node_modules/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico
  artifactName: chatr-desktop-setup.${ext}
  publisherName: "TalentXcel Services Pvt Ltd"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CHATR OS
  include: electron/installer.nsh

protocols:
  name: chatr-deep-link
  schemes:
    - chatr

fileAssociations:
  - ext: chatr
    name: CHATR OS Workspace
    role: Editor
  - ext: workflow
    name: CHATR Automation Workflow
    role: Editor
  - ext: memory
    name: CHATR AI Memory Pack
    role: Viewer

mac:
  target:
    - dmg
    - zip
  icon: public/icons/icon-512x512.png
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  icon: public/icons/icon-512x512.png
  category: Utility
