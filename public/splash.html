<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CHATR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .splash { width: 420px; height: 280px; background: linear-gradient(135deg, #09090b 0%, #0f0f14 60%, #12101a 100%); border-radius: 20px; border: 1px solid rgba(124,58,237,0.3); box-shadow: 0 32px 80px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; position: relative; overflow: hidden; }
    .splash::before { content: ''; position: absolute; top: -40%; left: -20%; width: 80%; height: 80%; background: radial-gradient(ellipse, rgba(124,58,237,0.15) 0%, transparent 70%); pointer-events: none; }
    .logo-ring { position: relative; width: 72px; height: 72px; }
    .logo-ring svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; animation: spin 2s linear infinite; }
    .logo-inner { position: absolute; top: 8px; left: 8px; width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #7c3aed, #4f46e5); box-shadow: 0 8px 24px rgba(124,58,237,0.5); display: flex; align-items: center; justify-content: center; }
    .logo-text { font-size: 20px; font-weight: 900; color: white; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .wordmark { text-align: center; }
    .wordmark h1 { font-size: 22px; font-weight: 800; color: #ffffff; }
    .wordmark p { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }
    .progress-bar { width: 180px; height: 2px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #a78bfa); border-radius: 99px; animation: progress 1.8s ease-in-out infinite; }
    @keyframes progress { 0% { width: 0%; opacity: 1; } 60% { width: 85%; opacity: 1; } 100% { width: 100%; opacity: 0; } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-ring">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed" stop-opacity="1"/><stop offset="50%" stop-color="#4f46e5" stop-opacity="0.4"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></linearGradient></defs>
        <circle cx="36" cy="36" r="33" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="logo-inner"><span class="logo-text">C+</span></div>
    </div>
    <div class="wordmark"><h1>chatr+</h1><p>AI Intelligence Platform</p></div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>
</body>
</html>
