apiVersion: apps/v1
kind: Deployment
metadata:
  name: cer-inference-kernel
  namespace: cer-platform
  labels:
    app: inference-kernel
    tier: stateless-compute
spec:
  replicas: 10
  selector:
    matchLabels:
      app: inference-kernel
  template:
    metadata:
      labels:
        app: inference-kernel
    spec:
      containers:
      - name: kernel
        image: enterprise/cer-kernel:v1.0.8
        env:
        - name: DEPLOYMENT_MODE
          value: "AIR_GAPPED"
        - name: EVENT_BUS_URI
          value: "kafka://cer-event-bus:9092"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cer-event-bus
  namespace: cer-platform
spec:
  serviceName: "cer-event-bus-svc"
  replicas: 5
  selector:
    matchLabels:
      app: event-bus
  template:
    metadata:
      labels:
        app: event-bus
    spec:
      containers:
      - name: kafka
        image: enterprise/kafka:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cer-projection-engine
  namespace: cer-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: projection-engine
  template:
    metadata:
      labels:
        app: projection-engine
    spec:
      containers:
      - name: projection-worker
        image: enterprise/cer-projection:v1.0.8
        env:
        - name: NEO4J_URI
          value: "bolt://cer-graph-db:7687"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cer-airgapped-llm
  namespace: cer-platform
spec:
  replicas: 4
  selector:
    matchLabels:
      app: airgapped-llm
  template:
    metadata:
      labels:
        app: airgapped-llm
    spec:
      nodeSelector:
        accelerator: nvidia-a100
      containers:
      - name: vllm-inference
        image: vllm/vllm-openai:latest
        args: ["--model", "mistralai/Mistral-7B-Instruct-v0.2", "--gpu-memory-utilization", "0.95"]
